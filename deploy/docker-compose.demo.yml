# agent-gateway 公开 demo 单机 docker-compose（spec §public-demo round 80）
#
# 用法：
#   docker compose -f deploy/docker-compose.demo.yml up -d
#   curl http://localhost:8080/v1/info
#   curl -X POST http://localhost:8080/v1/demo/bootstrap
#
# 然后用 /demo 端点返回的 apiKey 调 /v1/chat/stream 或 /v1/admin/me 等
# Demo 模式 24h 自动清理（key / tenant / expiresAt）
#
# 端点：
#   /v1/info - 元数据 + feature flags
#   /v1/demo/bootstrap - 1 键开通试用租户
#   /v1/demo/status - 探测 demo mode 是否启用
#   /v1/demo/reset - 清当前 demo（按 X-API-Key）
#   /v1/chat/stream - SSE 聊天（需 X-API-Key + X-Tenant-Id）
#   /v1/admin/me - 当前 admin 自查
#
# 生产部署建议 k8s + helm（deploy/helm/agent-gateway/），不要 docker-compose。

services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: demo-postgres
    environment:
      POSTGRES_USER: agentgateway
      POSTGRES_PASSWORD: agentgateway
      POSTGRES_DB: agentgateway
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentgateway -d agentgateway"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - demo-pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  gateway:
    image: ghcr.io/tlbfpx/agent-gateway:v0.3.0
    container_name: demo-gateway
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # 必填
      GATEWAY_DEMO_ENABLED: "true"
      GATEWAY_REPLAY_PAYLOAD_KEY_REF: "demo-only-replay-key-32-bytes"
      # 公开 demo 模式：admin token 公开（生产请用 secret 注入）
      GATEWAY_ADMIN_TOKEN: "demo-public-admin-token"
      # Postgres
      observability_storage_jdbc_url: "jdbc:postgresql://postgres:5432/agentgateway"
      observability_storage_username: "agentgateway"
      observability_storage_password: "agentgateway"
      # LLM key（演示用占位 key，real 部署时替换）
      MINIMAX_API_KEY: "sk-demo-placeholder"
      OPENAI_API_KEY: "sk-demo-placeholder"
      DASHSCOPE_API_KEY: "sk-demo-placeholder"
      DEEPSEEK_API_KEY: "sk-demo-placeholder"
      ZHIPU_API_KEY: "sk-demo-placeholder"
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/status.json | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    restart: unless-stopped

volumes:
  demo-pgdata:
    driver: local