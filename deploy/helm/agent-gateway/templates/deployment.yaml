apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "agent-gateway.fullname" . }}
  labels: {{- include "agent-gateway.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels: {{- include "agent-gateway.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels: {{- include "agent-gateway.selectorLabels" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations: {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "agent-gateway.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext: {{- toYaml .Values.podSecurityContext | nindent 8 }}
      terminationGracePeriodSeconds: 30
      containers:
        - name: gateway
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext: {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: JAVA_TOOL_OPTIONS
              value: "{{ .Values.jvm.extraOpts }}"
            - name: JAVA_OPTS
              value: "-Xmx{{ .Values.jvm.heapMax }}"
            - name: SPRING_CONFIG_LOCATION
              value: "classpath:/,file:/app/config/"
            - name: SPRING_CONFIG_ADDITIONAL_LOCATION
              value: "optional:file:/app/config/"
            - name: OBSERVABILITY_STORAGE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "agent-gateway.secretName" . }}
                  key: observ-postgres-password
            - name: GATEWAY_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "agent-gateway.secretName" . }}
                  key: gateway-admin-token
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "agent-gateway.secretName" . }}
                  key: openai-api-key
            - name: DASHSCOPE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "agent-gateway.secretName" . }}
                  key: dashscope-api-key
            - name: DEEPSEEK_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "agent-gateway.secretName" . }}
                  key: deepseek-api-key
            - name: ZHIPU_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "agent-gateway.secretName" . }}
                  key: zhipu-api-key
            - name: MINIMAX_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "agent-gateway.secretName" . }}
                  key: minimax-api-key
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.liveness.path }}
              port: http
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readiness.path }}
              port: http
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            timeoutSeconds: 3
            failureThreshold: 3
          resources: {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /app/config
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: data
              mountPath: /app/data
      volumes:
        - name: config
          configMap:
            name: {{ include "agent-gateway.fullname" . }}-config
            items:
              - key: application.yml
                path: application.yml
              - key: logback-spring.xml
                path: logback-spring.xml
        - name: tmp
          emptyDir: {}
        - name: data
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}