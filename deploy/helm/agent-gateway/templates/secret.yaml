{{- if not .Values.secrets.existingSecret -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "agent-gateway.secretName" . }}
  labels: {{- include "agent-gateway.labels" . | nindent 4 }}
type: Opaque
stringData:
  observ-postgres-password: {{ .Values.secrets.observPostgresPassword | quote }}
  gateway-admin-token: {{ .Values.secrets.gatewayAdminToken | quote }}
  openai-api-key: {{ .Values.secrets.openaiApiKey | quote }}
  dashscope-api-key: {{ .Values.secrets.dashscopeApiKey | quote }}
  deepseek-api-key: {{ .Values.secrets.deepseekApiKey | quote }}
  zhipu-api-key: {{ .Values.secrets.zhipuApiKey | quote }}
  minimax-api-key: {{ .Values.secrets.minimaxApiKey | quote }}
{{- end -}}